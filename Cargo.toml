[package]
name = "wde-mcp-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "wde_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "wde-mcp-stdio"
path = "src/main.rs"

[[bin]]
name = "wde-mcp-http"
path = "src/bin/http_server.rs"

[dependencies]
rmcp = { git = "https://github.com/branben/rust-sdk.git", branch = "feat/sep-2640-skills", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
axum = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
